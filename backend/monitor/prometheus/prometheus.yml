global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'spring-websocket-cluster'
    environment: 'production'

scrape_configs:
  # Prometheus 자체 모니터링
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Spring Boot Multi-WAS 모니터링
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['app-1:8080', 'app-2:8080']
        labels:
          application: 'coffee-shout'
          environment: 'production'

  # Redis Exporter 모니터링
  - job_name: 'redis-exporter'
    scrape_interval: 5s
    static_configs:
      - targets: ['redis-exporter:9121']
