services:
  #tempo
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml", "-config.expand-env=true" ]
    volumes:
      - ./data/tempo:/tmp/tempo
      - ./logs/tempo:/var/log/tempo
      - ./conf/tempo.yml:/etc/tempo.yaml
    expose:
      - "3200"
      - "4318"
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
    healthcheck:
      test: [ "CMD", "sh", "-c", "wget --quiet --tries=1 --spider http://localhost:3200/ready && wget --quiet --tries=1 --spider http://localhost:4318/ready" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    expose:
      - "9121"
    networks:
      - monitoring
      - app-network
    restart: unless-stopped

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - monitoring
      - app-network
    restart: unless-stopped

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_RENDERING_RENDERER_TOKEN=coffee-shout-local-renderer
      - GF_LOG_FILTERS=rendering:debug
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - prometheus
      - renderer

  # Grafana Image Renderer
  renderer:
    build:
      context: ./grafana/renderer
    image: coffee-shout-grafana-image-renderer:local
    container_name: grafana-image-renderer
    environment:
      - AUTH_TOKEN=coffee-shout-local-renderer
      - TZ=Asia/Seoul
    expose:
      - "8081"
    networks:
      - monitoring
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge
  app-network:
    external: true
    name: backend_default

volumes:
  prometheus-data:
  grafana-data:
