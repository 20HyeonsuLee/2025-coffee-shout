spring:
  application:
    name:
      coffee-shout
  datasource:
    url: jdbc:mysql://localhost:33061/coffee_shout
    username: root
    password: coffee-shout_123
    driver-class-name: com.mysql.cj.jdbc.Driver
  lifecycle:
    timeout-per-shutdown-phase: 5m
  data:
    redis:
      port: 6379
      ssl:
        enabled: false
      host: localhost
      stream:
        room-join-key: room:broadcast
        card-game-select-key: cardGame:select:broadcast
        racing-game-key: racingGame:broadcast
        max-length: 100
  cloud:
    aws:
      s3:
        bucket: coffee-shout-local

room:
  removalDelay: 1h
  event:
    timeout: 5s
  qr:
    prefix: "http://localhost:3000/room/"
    height: 300
    width: 300
    presigned-url:
      expiration-hours: 1
    s3-key-prefix: "qr/"

logging:
  level:
    root: info
    io.opentelemetry.exporter.logging.LoggingSpanExporter: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus,tracing"
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://43.200.101.122:4318/v1/traces
  metrics:
    enable:
      tomcat: true

  prometheus:
    metrics:
      export:
        enabled: true
server:
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true
    threads:
      max: 200
      min-spare: 30
    max-connections: 700
    accept-count: 300

websocket:
  inbound:
    virtual-threads: false
    concurrency-limit: 64
    pool-size: 16
  docs:
    enabled: true
    base-package: "coffeeshout"
    app-path: "/app"
    topic-path: "/topic"
    server-url: "http://localhost:8080/ws"
    info:
      title: "커피빵 WebSocket API 명세서"
      version: "1.0.0"
      description: "실시간 웹소켓 통신 API 문서"

racing-game:
  stream:
    async: true
    io-threads: 2
    async-connection-count: 2

loadtest:
  xadd:
    io-threads: 4
    connection-count: 4
    stream-key: "loadtest:xadd"
    max-length: 1000
