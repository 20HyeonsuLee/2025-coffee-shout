spring:
  datasource:
    url: jdbc:mysql://mysql:3306/coffee_shout?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: root
    password: coffee-shout_123
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    aws:
      s3:
        enabled: false
  docker:
    compose:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create
  flyway:
    enabled: false
  data:
    redis:
      host: redis
      port: 6379
      ssl:
        enabled: false

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus,tracing"
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://tempo:4318/v1/traces

redisson:
  enabled: false

logging:
  level:
    coffeeshout: INFO
    org.springframework.web: INFO
